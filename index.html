<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixel Tube</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #181818;
    padding: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
}

.logo {
    color: #ff3333;
    font-size: 24px;
    font-weight: bold;
}

.search {
    display: flex;
    gap: 5px;
}

input {
    width: 180px;
    max-width: 60vw;
    padding: 12px;
    background: #252525;
    color: white;
    border: 1px solid #555;
    border-radius: 25px;
}

button {
    padding: 10px 15px;
    background: #ff3030;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}

nav {
    padding: 12px;
    overflow-x: auto;
    white-space: nowrap;
}

nav button {
    background: #303030;
    margin-right: 5px;
}

nav button:hover {
    background: #555;
}

h2 {
    padding: 0 15px;
}

.videos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
    padding: 15px;
}

.card {
    background: #202020;
    border-radius: 12px;
    overflow: hidden;
}

.card img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
}

.card h3 {
    margin: 12px;
    font-size: 17px;
}

.card p {
    margin: 12px;
    color: #aaa;
    font-size: 14px;
}

.card a {
    color: white;
    text-decoration: none;
}

footer {
    padding: 25px;
    text-align: center;
    color: #999;
}
</style>
</head>
